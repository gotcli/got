name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Dependencies
      - name: Dependencies | Download
        run: go mod download

      - name: Dependencies | Verify checksums
        run: go mod verify

      - name: Dependencies | Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Code Quality
      - name: Code Quality | Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Code Quality | Run go vet
        run: go vet ./...

      - name: Code Quality | Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Code Quality | Run Staticcheck
        run: staticcheck ./...

      # Tests
      - name: Tests | Run with race detector and coverage
        run: |
          go test \
            -v \
            -race \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./...

      - name: Tests | Show coverage
        run: go tool cover -func=coverage.out

      - name: Tests | Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      # Security
      - name: Security | Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Security | Run govulncheck
        run: govulncheck ./...

      # Build
      - name: Build | Compile all packages
        run: go build ./...
